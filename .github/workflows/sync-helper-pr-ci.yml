name: sexy00 sync helper PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: sexy00-sync-helper-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-helper-tests:
    name: sexy00-sync-helper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge result without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Run helper regression tests offline
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          node_dir="$(dirname "$node_bin")"
          test "$(node --version)" = 'v22.23.4'
          # Fail closed if network isolation cannot be established.
          sudo -n unshare --net -- setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --bounding-set=-all --no-new-privs \
            env -i \
            PATH="$node_dir:/usr/bin:/bin" \
            "$node_bin" --test tests/profile-sync-reliability.test.mjs
