name: Sync public profiles to sexy00.cc

on:
  schedule:
    # Lightweight catch-up check; actual catalogue sync runs once per six-hour slot.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      snapshot_check:
        description: "Read-only source and finalization check (no profile changes)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sexy00-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check six-hour slot (no data writes)
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/profile-sync-schedule.mjs
      - name: Verify sync helper regression tests
        if: steps.cadence.outputs.sync_required == 'true'
        run: node --test tests/profile-sync-reliability.test.mjs
      - name: Read-only source and receiver check
        if: steps.cadence.outputs.sync_required == 'true' && inputs.snapshot_check == true
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --snapshot-check
      - name: Commit profile catalogue (six-hour slot)
        if: steps.cadence.outputs.sync_required == 'true' && inputs.snapshot_check != true
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit

