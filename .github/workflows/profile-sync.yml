name: Sync public profiles to sexy00.cc

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sexy00-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Synchronize profiles to sexy00.cc
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit
