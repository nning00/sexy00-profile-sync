name: Deploy sexy00.cc Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "proxy.ts"
      - "vinext.config.*"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Check cleanup safely
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --cleanup-check
      - name: Remove approved unused media
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --cleanup-only

