name: Verify sexy00 source body retry (offline)

on:
  push:
    branches:
      - fix/source-body-retry-20261113

permissions:
  contents: read

concurrency:
  group: sexy00-source-body-retry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    if: github.repository == 'nning00/sexy00-profile-sync' && github.ref == 'refs/heads/fix/source-body-retry-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select exact Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify exact reviewed files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '7adcc253634b2ff8672dbc3af7f28a98f581b0471258de3c54a3f6095a10218c  scripts/profile-sync-http.mjs' \
            '7e352c9f564902dfaeb67b4807c0d0c6380b154b3d9fb6dbadf695455bd53692  tests/profile-sync-reliability.test.mjs' \
            | sha256sum --check --strict -
          test "$(node --version)" = 'v22.23.4'
      - name: Run only regression tests with no network or inherited environment
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          node_dir="$(dirname "$node_bin")"
          # A fresh network namespace has no external interfaces/routes.
          # Failure to create it fails CI; there is intentionally no fallback.
          sudo -n unshare --net -- env -i \
            PATH="$node_dir:/usr/bin:/bin" \
            "$node_bin" --test tests/profile-sync-reliability.test.mjs
